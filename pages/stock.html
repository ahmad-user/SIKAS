<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Role-Based - Stock Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<!-- Mobile Topbar -->
<div class="md:hidden flex justify-between items-center bg-white shadow px-4 py-3">
    <h2 class="text-lg font-bold">POS System</h2>
    <button onclick="toggleSidebar()" class="text-2xl">
        ☰
    </button>
</div>

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed md:static top-0 left-0 h-full w-64 bg-white shadow-md 
        transform -translate-x-full md:translate-x-0 
        transition-transform duration-300 z-50">

        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">POS System</h2>
        </div>
            <nav class="p-4">
                <ul class="space-y-2">
                    <li><a href="dashboard.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Dashboard</a></li>
                    <li><a href="category.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Master Category</a></li>
                    <li><a href="products.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Master Products</a></li>
                    <li><a href="barcode.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Generate Barcode</a></li>
                    <li><a href="stock.html" class="block px-4 py-2 rounded bg-blue-100 text-gray-700">Stock</a></li>
                    <li><a href="delivery.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Product Delivery</a></li>
                    <li><a href="pos.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">POS / Kasir</a></li>
                    <li><a href="#" onclick="logout()" class="block px-4 py-2 rounded hover:bg-red-50 text-red-600">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto">
            <div class="p-8">
                <h1 class="text-3xl font-bold mb-6 text-gray-800">Stock Management</h1>

                <div class="bg-white rounded-lg shadow p-4 mb-6">
                    <div class="flex gap-4">
                        <input id="searchStockInput" type="text" placeholder="Search product..." class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" onkeyup="filterStock()">
                        <select id="categoryStockFilter" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filterStock()">
                            <option value="">All Categories</option>
                            <option value="Minuman">Minuman</option>
                            <option value="Makanan">Makanan</option>
                        </select>
                        <button onclick="clearFilters()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Clear</button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Produk</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Last Stock</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Last Update</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <!-- Stock data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/stock.js"></script>
    <script>loadStock();</script>
</body>
</html>
