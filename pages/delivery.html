<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Role-Based - Product Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<!-- Mobile Topbar -->
<div class="md:hidden flex justify-between items-center bg-white shadow px-4 py-3">
    <h2 class="text-lg font-bold">POS System</h2>
    <button onclick="toggleSidebar()" class="text-2xl">
        ☰
    </button>
</div>

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed md:static top-0 left-0 h-full w-64 bg-white shadow-md 
        transform -translate-x-full md:translate-x-0 
        transition-transform duration-300 z-50">

        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">POS System</h2>
        </div>

            <nav class="p-4">
                <ul class="space-y-2">
                    <li><a href="dashboard.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Dashboard</a></li>
                    <li><a href="category.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Master Category</a></li>
                    <li><a href="products.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Master Products</a></li>
                    <li><a href="barcode.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Generate Barcode</a></li>
                    <li><a href="stock.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Stock</a></li>
                    <li><a href="delivery.html" class="block px-4 py-2 rounded bg-blue-100 text-gray-700">Product Delivery</a></li>
                    <li><a href="pos.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">POS / Kasir</a></li>
                    <li><a href="#" onclick="logout()" class="block px-4 py-2 rounded hover:bg-red-50 text-red-600">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto">
            <div class="p-8">
                <h1 class="text-3xl font-bold mb-6 text-gray-800">Product Delivery (Barang Masuk)</h1>

                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <h2 class="text-xl font-bold mb-4 text-gray-800">Form Barang Masuk</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Produk</label>
                            <select id="deliveryProductSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Pilih Produk</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                            <input id="deliveryQuantityInput" type="number" min="1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Supplier</label>
                            <input id="deliverySupplierInput" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                            <input id="deliveryDateInput" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <button onclick="submitDelivery()" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transform hover:scale-105 transition-all duration-200">Submit</button>
                </div>

                <div class="bg-white rounded-lg shadow">
                    <div class="p-6 border-b">
                        <h2 class="text-xl font-bold text-gray-800">Riwayat Barang Masuk</h2>
                    </div>
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Tanggal</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Produk</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Qty</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Supplier</th>
                            </tr>
                        </thead>
                        <tbody id="deliveryTableBody">
                            <!-- Delivery history will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/delivery.js"></script>
    <script>loadDeliveries();</script>
</body>
</html>
