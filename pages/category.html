<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Role-Based - Master Category</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<!-- Mobile Topbar -->
<div class="md:hidden flex justify-between items-center bg-white shadow px-4 py-3">
    <h2 class="text-lg font-bold">POS System</h2>
    <button onclick="toggleSidebar()" class="text-2xl">
        ☰
    </button>
</div>

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed md:static top-0 left-0 h-full w-64 bg-white shadow-md 
        transform -translate-x-full md:translate-x-0 
        transition-transform duration-300 z-50">

        <div class="p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">POS System</h2>
        </div>

            <nav class="p-4">
                <ul class="space-y-2">
                    <li><a href="dashboard.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Dashboard</a></li>
                    <li><a href="category.html" class="block px-4 py-2 rounded bg-blue-100 text-gray-700">Master Category</a></li>
                    <li><a href="products.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Master Products</a></li>
                    <li><a href="barcode.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Generate Barcode</a></li>
                    <li><a href="stock.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Stock</a></li>
                    <li><a href="delivery.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">Product Delivery</a></li>
                    <li><a href="pos.html" class="block px-4 py-2 rounded hover:bg-blue-50 text-gray-700">POS / Kasir</a></li>
                    <li><a href="#" onclick="logout()" class="block px-4 py-2 rounded hover:bg-red-50 text-red-600">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-800">Master Category</h1>
                    <button onclick="openCategoryModal('add')" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">+ Add Category</button>
                </div>

                <div class="bg-white rounded-lg shadow">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">ID</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Nama Kategori</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Deskripsi</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Action</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <tr class="border-t">
                                <td class="px-6 py-4">1</td>
                                <td class="px-6 py-4">Minuman</td>
                                <td class="px-6 py-4">Minuman ringan dan berat</td>
                                <td class="px-6 py-4">
                                    <button onclick="openCategoryModal('edit', 'Minuman')" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                                    <button onclick="deleteCategory('Minuman')" class="text-red-600 hover:text-red-800">Delete</button>
                                </td>
                            </tr>
                            <tr class="border-t">
                                <td class="px-6 py-4">2</td>
                                <td class="px-6 py-4">Makanan</td>
                                <td class="px-6 py-4">Makanan instan</td>
                                <td class="px-6 py-4">
                                    <button onclick="openCategoryModal('edit', 'Makanan')" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                                    <button onclick="deleteCategory('Makanan')" class="text-red-600 hover:text-red-800">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Include Modals -->
    <div id="categoryModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen">
            <div class="bg-white rounded-lg shadow-lg w-full max-w-md">
                <div class="p-6">
                    <h2 id="modalTitle" class="text-xl font-bold mb-4">Tambah Kategori</h2>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Category Name</label>
                        <input id="categoryNameInput" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Masukkan nama kategori">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button onclick="closeCategoryModal()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400">Batal</button>
                        <button onclick="saveCategory()" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">Simpan</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/category.js"></script>
</body>
</html>
